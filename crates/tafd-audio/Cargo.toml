[package]
name = "tafd-audio"
version = "0.1.0"
edition = "2021"

[dependencies]
tafd-core = { path = "../tafd-core" }
cpal = "0.15"
crossbeam = "0.8"
hound = "3.5"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
