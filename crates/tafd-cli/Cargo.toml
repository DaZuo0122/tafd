[package]
name = "tafd-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tafd"
path = "src/main.rs"

[dependencies]
tafd-core = { path = "../tafd-core" }
tafd-audio = { path = "../tafd-audio" }
tafd-input = { path = "../tafd-input" }

clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
directories = "5.0"
env_logger = "0.11"
log = { version = "0.4", features = ["release_max_level_warn"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
